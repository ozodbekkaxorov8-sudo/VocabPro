services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: vocabpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      VOCABPRO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./database/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vocabpro", "-d", "vocabpro"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vocabpro:${POSTGRES_PASSWORD}@db:5432/vocabpro}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TEACHER_CODE: ${TEACHER_CODE:?Set TEACHER_CODE}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
volumes:
  pg_data:
